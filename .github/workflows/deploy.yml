name: Deploy to Traefik server

# Deploys the backend to the shared Traefik host (87.239.135.154).
#
# Strategy: build-from-source ON the server. The repo working tree is
# shipped to the server with scp from the runner (so the server itself
# needs no GitHub credentials for this private repo), then the server
# runs `docker compose -f docker-compose.traefik.yml up -d --build`.
#
# Traefik (in /opt/edge, owned by the host) terminates TLS and routes by
# Host. Our container only joins the external `web` network and declares
# routing via labels — see docker-compose.traefik.yml.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: /opt/presenton

jobs:
  deploy:
    name: Build & deploy on server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Copy the working tree to the server. app_data (the SQLite DB,
      # mem0, exports) lives only on the server and is never in the
      # checkout, so it is untouched by this sync.
      - name: Copy repo to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "."
          target: ${{ env.APP_DIR }}
          # Keep the transfer lean and never clobber server-only state.
          rm: false
          overwrite: true
          strip_components: 0

      - name: Build & start on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.APP_DIR }}
          LLM: ${{ secrets.LLM || 'openai' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4.1' }}
          IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER || 'gpt-image-1.5' }}
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          ADAPTY_WEBHOOK_SECRET: ${{ secrets.ADAPTY_WEBHOOK_SECRET }}
          FASTAPI_PUBLIC_URL: ${{ secrets.FASTAPI_PUBLIC_URL || 'https://appbackendnew.store' }}
          TOKEN_COST_PER_GENERATION: ${{ secrets.TOKEN_COST_PER_GENERATION || '10' }}
          SUBSCRIPTION_TOKENS_GRANT: ${{ secrets.SUBSCRIPTION_TOKENS_GRANT || '100' }}
          SUBSCRIPTION_PRODUCT_WEEKLY: ${{ secrets.SUBSCRIPTION_PRODUCT_WEEKLY || 'weekly_subscription' }}
          SUBSCRIPTION_PRODUCT_YEARLY: ${{ secrets.SUBSCRIPTION_PRODUCT_YEARLY || 'yearly_subscription' }}
          SUBSCRIPTION_TOKENS_WEEKLY: ${{ secrets.SUBSCRIPTION_TOKENS_WEEKLY || '50' }}
          SUBSCRIPTION_TOKENS_YEARLY: ${{ secrets.SUBSCRIPTION_TOKENS_YEARLY || '500' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: APP_DIR,LLM,OPENAI_API_KEY,OPENAI_MODEL,IMAGE_PROVIDER,SERVICE_API_KEY,ADMIN_API_KEY,ADAPTY_WEBHOOK_SECRET,FASTAPI_PUBLIC_URL,TOKEN_COST_PER_GENERATION,SUBSCRIPTION_TOKENS_GRANT,SUBSCRIPTION_PRODUCT_WEEKLY,SUBSCRIPTION_PRODUCT_YEARLY,SUBSCRIPTION_TOKENS_WEEKLY,SUBSCRIPTION_TOKENS_YEARLY
          script_stop: true
          command_timeout: 40m
          script: |
            set -eu
            cd "$APP_DIR"

            # The shared external network Traefik lives on. Create only if
            # missing — never recreate (would disrupt other services).
            docker network inspect web >/dev/null 2>&1 || docker network create web

            # Rebuild .env from CI secrets — GitHub Secrets are the single
            # source of truth, so secret rotation propagates on next deploy.
            umask 077
            cat > .env <<EOF
            LLM=${LLM}
            OPENAI_API_KEY=${OPENAI_API_KEY}
            OPENAI_MODEL=${OPENAI_MODEL}
            IMAGE_PROVIDER=${IMAGE_PROVIDER}
            CAN_CHANGE_KEYS=True
            SERVICE_API_KEY=${SERVICE_API_KEY}
            ADMIN_API_KEY=${ADMIN_API_KEY}
            ADAPTY_WEBHOOK_SECRET=${ADAPTY_WEBHOOK_SECRET}
            FASTAPI_PUBLIC_URL=${FASTAPI_PUBLIC_URL}
            TOKEN_COST_PER_GENERATION=${TOKEN_COST_PER_GENERATION}
            SUBSCRIPTION_TOKENS_GRANT=${SUBSCRIPTION_TOKENS_GRANT}
            SUBSCRIPTION_PRODUCT_WEEKLY=${SUBSCRIPTION_PRODUCT_WEEKLY}
            SUBSCRIPTION_PRODUCT_YEARLY=${SUBSCRIPTION_PRODUCT_YEARLY}
            SUBSCRIPTION_TOKENS_WEEKLY=${SUBSCRIPTION_TOKENS_WEEKLY}
            SUBSCRIPTION_TOKENS_YEARLY=${SUBSCRIPTION_TOKENS_YEARLY}
            EOF

            # Free space before the (heavy) build so an old image layer
            # cache cannot fill the shared disk. Only removes images not
            # used by a running container.
            docker image prune -af || true
            docker builder prune -af --filter "until=72h" || true

            docker compose -f docker-compose.traefik.yml up -d --build --remove-orphans

            # Drop dangling layers left by the rebuild.
            docker image prune -f || true

            docker compose -f docker-compose.traefik.yml ps
