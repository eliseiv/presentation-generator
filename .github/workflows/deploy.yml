name: Deploy to Traefik server

# Deploys every Presenton instance on the shared Traefik host.
#
# Strategy: build-from-source ON the server. The repo working tree is
# shipped to a staging dir with scp from the runner (so the server itself
# needs no GitHub credentials for this private repo), then each instance
# is rsynced into /opt/<inst> and started with
# `docker compose -p <inst> -f docker-compose.traefik.yml --env-file .env`.
#
# Traefik (in /opt/edge, owned by the host) terminates TLS and routes by
# Host. Our container only joins the external `web` network and declares
# routing via labels — see docker-compose.traefik.yml.
#
# Secrets: ALL application secrets live in /opt/<inst>/.env ON THE
# SERVER (managed by the operator), not in GitHub. GitHub only holds the
# SSH access secrets (SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, optional
# SSH_PORT). The deploy never reads or rewrites .env — it is .gitignored
# so the sync cannot clobber it, and the build step only checks that
# it exists.
#
# Instances (project-name == /opt dir): presenton, havoreni

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  STAGING_DIR: /opt/_presenton_src
  # "<inst>:<inst>" — compose project-name : /opt directory.
  INSTANCES: "presenton:presenton havoreni:havoreni"

jobs:
  deploy:
    name: Build & deploy on server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy repo to server staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "."
          target: ${{ env.STAGING_DIR }}
          rm: false
          overwrite: true
          strip_components: 0

      - name: Build & start every instance
        uses: appleboy/ssh-action@v1.2.0
        env:
          STAGING_DIR: ${{ env.STAGING_DIR }}
          INSTANCES: ${{ env.INSTANCES }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: STAGING_DIR,INSTANCES
          script_stop: true
          command_timeout: 40m
          script: |
            set -eu

            docker network inspect web >/dev/null 2>&1 || docker network create web

            docker image prune -af || true
            docker builder prune -af --filter "until=72h" || true

            for spec in $INSTANCES; do
              inst="${spec%%:*}"
              dir="/opt/${spec##*:}"
              echo "===== deploy $inst → $dir ====="

              if [ ! -d "$dir" ]; then
                echo "ERROR: $dir is missing. Provision the instance before deploying." >&2
                exit 1
              fi
              if [ ! -f "$dir/.env" ]; then
                echo "ERROR: $dir/.env is missing. Create it on the server before deploying." >&2
                exit 1
              fi

              rsync -a --delete \
                --exclude '.env' \
                --exclude '.env.*' \
                --exclude 'app_data/' \
                --exclude '.git/' \
                "$STAGING_DIR"/ "$dir"/

              cd "$dir"
              docker compose -p "$inst" -f docker-compose.traefik.yml --env-file .env \
                up -d --build --remove-orphans
              docker compose -p "$inst" -f docker-compose.traefik.yml --env-file .env ps
            done

            docker image prune -f || true
