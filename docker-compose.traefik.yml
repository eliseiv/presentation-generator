# Deployment compose for the shared Traefik host.
#
# Multi-instance: each clone lives in /opt/<INSTANCE_NAME>, is started with
# `docker compose -p <INSTANCE_NAME> -f docker-compose.traefik.yml --env-file .env`,
# and is routed by Host(`${PUBLIC_HOST}`). Shared with neighbors: only the
# external `web` network and edge-Traefik. Defaults keep the original
# `presenton` / `appbackendnew.store` instance unchanged.
#
# Differences from docker-compose.deploy.yml (old standalone server):
#   - No published ports. The shared Traefik on the host owns 80/443.
#   - Joins the external `web` network so Traefik can reach us, plus the
#     internal `default` network for anything container-local.
#   - Routing is declared via Traefik labels, not our own nginx vhost.
#   - TLS is terminated by Traefik (Let's Encrypt resolver `le`); we do
#     not manage certs.
#
# The container still runs its OWN internal nginx on port 80 (from
# nginx.internal.conf via start.js): that nginx does PATH routing inside
# the container — `/` → Next.js:3000, `/api/v1`, `/docs`, `/app_data`,
# `/healthz` and `/health` → FastAPI:8000. Traefik only routes by Host to this single
# port 80; the internal nginx splits the paths. So Traefik's
# loadbalancer target is port 80.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${INSTANCE_NAME:-presenton}-backend:local
    container_name: ${INSTANCE_NAME:-presenton}-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_DATA_DIRECTORY: /app_data
      TEMP_DIRECTORY: /tmp/presenton
      FASTAPI_HOST: 0.0.0.0
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      USER_CONFIG_PATH: /app_data/userConfig.json
      PRESENTON_APP_ROOT: /app
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      # Public origin used to build absolute asset URLs embedded in the
      # exported PPTX/PDF. Must be the externally reachable HTTPS domain.
      FASTAPI_PUBLIC_URL: ${FASTAPI_PUBLIC_URL:-https://${PUBLIC_HOST:-appbackendnew.store}}
      MIGRATE_DATABASE_ON_STARTUP: ${MIGRATE_DATABASE_ON_STARTUP:-true}
      CLEANUP_TTL_SECONDS: ${CLEANUP_TTL_SECONDS:-7200}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-600}
      START_OLLAMA: ${START_OLLAMA:-false}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-gpt-image-1.5}
      MEM0_ENABLED: ${MEM0_ENABLED:-true}
      MEM0_DIR: ${MEM0_DIR:-/app_data/mem0}
      MEM0_EMBEDDER_PROVIDER: ${MEM0_EMBEDDER_PROVIDER:-fastembed}
      MEM0_EMBEDDER_MODEL: ${MEM0_EMBEDDER_MODEL:-BAAI/bge-small-en-v1.5}
      MEM0_EMBEDDING_DIMS: ${MEM0_EMBEDDING_DIMS:-384}
      LITEPARSE_DPI: ${LITEPARSE_DPI:-120}
      LITEPARSE_NUM_WORKERS: ${LITEPARSE_NUM_WORKERS:-1}
      # Billing
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADAPTY_WEBHOOK_SECRET: ${ADAPTY_WEBHOOK_SECRET:-}
      TOKEN_COST_PER_GENERATION: ${TOKEN_COST_PER_GENERATION:-10}
      SUBSCRIPTION_TOKENS_GRANT: ${SUBSCRIPTION_TOKENS_GRANT:-100}
      SUBSCRIPTION_PRODUCT_WEEKLY: ${SUBSCRIPTION_PRODUCT_WEEKLY:-week_6.99_nottrial}
      SUBSCRIPTION_PRODUCT_YEARLY: ${SUBSCRIPTION_PRODUCT_YEARLY:-yearly_49.99_nottrial}
      SUBSCRIPTION_TOKENS_WEEKLY: ${SUBSCRIPTION_TOKENS_WEEKLY:-100}
      SUBSCRIPTION_TOKENS_YEARLY: ${SUBSCRIPTION_TOKENS_YEARLY:-1000}
      # Consumable token packs (one-time purchases): "<product_id>:<tokens>,..."
      TOKEN_PACK_PRODUCTS: ${TOKEN_PACK_PRODUCTS:-100_Tokens_9.99:100,250_Tokens_19.99:250,500_Tokens_34.99:500,1000_Tokens_59.99:1000,2000_Tokens_99.99:2000,100_tokens_9.99:100,250_tokens_19.99:250,500_tokens_34.99:500,1000_tokens_59.99:1000,2000_tokens_99.99:2000}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      APPSTORE_BUNDLE_ID: ${APPSTORE_BUNDLE_ID:-}
      APPSTORE_ENVIRONMENT: ${APPSTORE_ENVIRONMENT:-sandbox}
      STOREKIT_ALLOW_XCODE: ${STOREKIT_ALLOW_XCODE:-true}
      STOREKIT_DEV_SKIP_CERT_CHAIN_VERIFICATION: ${STOREKIT_DEV_SKIP_CERT_CHAIN_VERIFICATION:-true}
    working_dir: /app/servers/fastapi
    volumes:
      - ./app_data:/app_data
    expose:
      - "80"
    networks:
      - web
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${INSTANCE_NAME:-presenton}.rule=Host(`${PUBLIC_HOST:-appbackendnew.store}`)"
      - "traefik.http.routers.${INSTANCE_NAME:-presenton}.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME:-presenton}.tls.certresolver=le"
      - "traefik.http.services.${INSTANCE_NAME:-presenton}.loadbalancer.server.port=80"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=3)",
        ]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 90s

networks:
  web:
    external: true
  default:
